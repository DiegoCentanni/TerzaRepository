<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pagina effetti speciali</title>
    <link rel="stylesheet" href="Styles.css">
</head>

<body>

    <h1>Pagina effetti speciali</h1>

    <button id="btn">Testo a sorpresa</button>

    <div id="sorpresa"></div>


    <script>

        let fase = 0;

        document.getElementById("btn").addEventListener("click", funzione);

        function funzione() {
            const testo = document.getElementById("sorpresa");
            const btn = document.getElementById("btn");

            // ---------------- FASE 0 ----------------
            if (fase === 0) {
                testo.innerHTML = "PEPPEREPE";
                btn.textContent = "Nuova sorpresa";
                fase = 1;
            }

            // ---------------- FASE 1 ----------------
            else if (fase === 1) {
                alert("TADAAAA!");
                btn.textContent = "E ora un bel disegno";
                fase = 2;
            }

            // ---------------- FASE 2 ----------------
            else if (fase === 2) {
                testo.innerHTML =
                    generaTriangoloVuoto(7) +
                    "<br>" +
                    generaRomboVuoto(7);

                btn.textContent = "Torna a capo";
                fase = 3;
            }

            // ---------------- FASE 3 (RESET) ----------------
            else if (fase === 3) {
                testo.innerHTML = "";
                btn.textContent = "Testo a sorpresa";
                fase = 0;
            }
        }


        /* --------------------------------------------------
           TRIANGOLO COME NELL'IMMAGINE (vuoto dentro)
        -------------------------------------------------- */

        function generaTriangoloVuoto(lato) {
            let html = "<div class='disegno'>";

            for (let r = 0; r < lato; r++) {
                html += "<div class='row'>";

                for (let c = 0; c <= r; c++) {
                    if (c === 0 || c === r || r === lato - 1) {
                        html += "<div class='box'></div>";
                    } else {
                        html += "<div class='vuoto'></div>";
                    }
                }

                html += "</div>";
            }

            html += "</div>";
            return html;
        }


        /* --------------------------------------------------
           ROMBO COME NELL'IMMAGINE (vuoto dentro)
        -------------------------------------------------- */

        function generaRomboVuoto(lato) {
            let html = "<div class='disegno'>";

            // Parte superiore del rombo
            for (let r = 0; r < lato; r++) {
                html += "<div class='row'>";
                for (let c = 0; c <= r; c++) {
                    if (c === 0 || c === r) html += "<div class='box'></div>";
                    else html += "<div class='vuoto'></div>";
                }
                html += "</div>";
            }

            // Parte inferiore
            for (let r = lato - 2; r >= 0; r--) {
                html += "<div class='row'>";
                for (let c = 0; c <= r; c++) {
                    if (c === 0 || c === r) html += "<div class='box'></div>";
                    else html += "<div class='vuoto'></div>";
                }
                html += "</div>";
            }

            html += "</div>";
            return html;
        }

    </script>

</body>
</html>
